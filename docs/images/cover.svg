<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">A chat that forgets next to a ledger that remembers</title>
<desc id="d">On the left a chat window whose messages fade away. On the right a ledger notebook with a checked list that stays.</desc>
<defs>
<clipPath id="card"><rect x="660" y="120" width="480" height="420" rx="24"/></clipPath>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#171E1D" flood-opacity=".12"/></filter>
</defs>
<rect width="1200" height="630" fill="#FAFAF8"/>
<circle cx="1080" cy="80" r="220" fill="#0E7C86" opacity=".07"/>
<circle cx="90" cy="600" r="180" fill="#0E7C86" opacity=".05"/>
<g font-family="Outfit, Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<text x="60" y="84" font-size="22" font-weight="600" fill="#6B7775" letter-spacing="3">BEFORE</text>
<text x="660" y="84" font-size="22" font-weight="600" fill="#0E7C86" letter-spacing="3">WITH CONTEXT LEDGER</text>
<g filter="url(#sh)"><rect x="60" y="120" width="480" height="420" rx="24" fill="#fff" stroke="#E4E4DF" stroke-width="2"/></g>
<circle cx="96" cy="154" r="7" fill="#E4E4DF"/><circle cx="120" cy="154" r="7" fill="#E4E4DF"/><circle cx="144" cy="154" r="7" fill="#E4E4DF"/>
<g><rect x="90" y="190" width="300" height="52" rx="16" fill="#EEF4F4"/><text x="110" y="223" font-size="20" fill="#171E1D">Here is the plan we agreed.</text></g>
<g opacity=".7"><rect x="190" y="262" width="320" height="52" rx="16" fill="#171E1D"/><text x="210" y="295" font-size="20" fill="#fff">Great, let's start building.</text></g>
<g opacity=".4"><rect x="90" y="334" width="330" height="52" rx="16" fill="#EEF4F4"/><text x="110" y="367" font-size="20" fill="#171E1D">Why did we choose that?</text></g>
<g opacity=".18"><rect x="190" y="406" width="300" height="52" rx="16" fill="#171E1D"/><text x="210" y="439" font-size="20" fill="#fff">I do not remember.</text></g>
<text x="300" y="580" font-size="24" font-weight="700" fill="#6B7775" text-anchor="middle">The chat forgets</text>
<path d="M565 330 H635" stroke="#0E7C86" stroke-width="5" stroke-linecap="round"/><path d="M618 312 L638 330 L618 348" fill="none" stroke="#0E7C86" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<g filter="url(#sh)"><rect x="660" y="120" width="480" height="420" rx="24" fill="#fff"/></g>
<rect x="660" y="120" width="26" height="420" fill="#0E7C86" clip-path="url(#card)"/>
<rect x="660" y="120" width="480" height="420" rx="24" fill="none" stroke="#0E7C86" stroke-width="3"/>
<rect x="712" y="150" width="200" height="34" rx="10" fill="#E3F1F2"/><text x="728" y="174" font-size="18" font-weight="700" fill="#0A5F67">.ctx/  the ledger</text>
<g font-size="21" fill="#171E1D">
<rect x="712" y="214" width="32" height="32" rx="9" fill="#0E7C86"/><path d="M717 230 l7 7 l12 -14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="760" y="238">The plan, in writing</text>
<rect x="712" y="268" width="32" height="32" rx="9" fill="#0E7C86"/><path d="M717 284 l7 7 l12 -14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="760" y="292">Every decision, with the reason</text>
<rect x="712" y="322" width="32" height="32" rx="9" fill="#0E7C86"/><path d="M717 338 l7 7 l12 -14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="760" y="346">A checklist for "done"</text>
<rect x="712" y="376" width="32" height="32" rx="9" fill="none" stroke="#0E7C86" stroke-width="3" stroke-dasharray="5 5"/><text x="760" y="400" fill="#6B7775">Still to do</text>
</g>
<rect x="712" y="440" width="380" height="64" rx="18" fill="#171E1D"/>
<text x="736" y="480" font-size="21" font-weight="600" fill="#fff">Not done until the checks pass</text>
<text x="900" y="580" font-size="24" font-weight="700" fill="#0E7C86" text-anchor="middle">The ledger remembers</text>
</g>
</svg>
