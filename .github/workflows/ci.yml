name: ci

on:
  push:
    branches: [main]
  pull_request:

# Every `uses:` below is pinned to a full commit SHA rather than a mutable
# tag, so what CI executes is a fixed artefact and not whatever the tag was
# repointed at overnight. The trailing comment carries the human-readable
# version; Dependabot (.github/dependabot.yml) bumps both together.

# The workflow-level default, so a job added later starts read-only rather
# than inheriting whatever the repository default happens to be. Each job
# restates it: `permissions` at job level replaces this wholesale, and an
# explicit block is what tests/test_supply_chain.py can hold to account.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # Read the source, and nothing else. No token write scope is needed
    # to run a test suite.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        include:
          # The README claims 3.8+, so 3.8 gets tested rather than assumed.
          # It is pinned to 22.04 because setup-python ships no 3.8 build for
          # 24.04 or for arm64 macOS.
          - os: ubuntu-22.04
            python: "3.8"
          # The interior versions only need one platform to stay honest.
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
    steps:
      # Exactly one matrix entry takes a full-history checkout. The vendored
      # fixture guard in tests/test_findings_rounds.py corroborates a 399-line
      # fixture against `git show f7fa623:ctx/findings.py`, and the depth-1
      # clone actions/checkout makes by default has no such ref, so that
      # guard skipped in every job on every push since it was written. The
      # other eight jobs stay shallow rather than pay the full clone.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: matrix.os != 'ubuntu-latest' || matrix.python != '3.13'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      # The worktree tier runs real git, so the runner needs an identity.
      - name: Configure git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      # `unittest discover` exits 0 on "Ran 0 tests", so one broken top-level
      # import in tests/support.py empties the suite and all nine jobs go
      # green having proved nothing. The count is therefore parsed out of the
      # suite's own output and held to a floor. This is Python rather than
      # shell because the same step runs on windows-latest: `shell: python`
      # is the one shell present on every OS in the matrix.
      - name: Test
        shell: python
        run: |
          import re
          import subprocess
          import sys

          # THE FLOOR. Raise it as the suite grows: it sits just under the
          # current count on purpose, because what it exists to catch is a
          # silent DROP, and a floor far below the real count cannot see one.
          # REQUIRED_FLOOR in tests/test_ci_floor.py is the same decision and
          # is asserted equal to this number; raise the two together.
          #
          # Raised from 1190 to 1420 in the maintainability wave: the suite it
          # guards reached 1433, and a floor 243 tests below the real count is
          # the exact drift this pair was written to prevent.
          SUITE_FLOOR = 1420

          command = [sys.executable, "-m"] + "unittest discover -s tests".split()
          proc = subprocess.run(command, capture_output=True, text=True,
                                encoding="utf-8", errors="replace")

          # Echo through the byte stream: a runner console that is not UTF-8
          # must not turn a test name into a crash in the checker.
          sys.stdout.flush()
          sys.stdout.buffer.write((proc.stdout + proc.stderr).encode("utf-8", "replace"))
          sys.stdout.buffer.flush()

          found = re.search(r"^Ran (\d+) tests? in ", proc.stderr, re.MULTILINE)
          if found is None:
              print("FAIL: no test count in the suite output. Expected a "
                    "'Ran N tests' line reporting at least %d tests; the suite "
                    "exited %d without running." % (SUITE_FLOOR, proc.returncode))
              raise SystemExit(1)

          ran = int(found.group(1))
          if ran < SUITE_FLOOR:
              print("FAIL: the suite ran %d tests, below the floor of %d. Tests "
                    "vanished or never ran. If the drop is deliberate, lower "
                    "SUITE_FLOOR in .github/workflows/ci.yml on purpose."
                    % (ran, SUITE_FLOOR))
              raise SystemExit(1)

          if proc.returncode != 0:
              print("FAIL: the suite ran %d tests (floor %d) and exited %d."
                    % (ran, SUITE_FLOOR, proc.returncode))
              raise SystemExit(proc.returncode)

          print("OK: the suite ran %d tests (floor %d)." % (ran, SUITE_FLOOR))

  # The Windows wrapper carries logic the POSIX one does not, and nothing ran
  # it: the entry-point check below is a ubuntu-only job, so `bin/ctx.cmd`
  # shipped for six versions swallowing every non-zero exit with no coverage.
  windows-wrapper:
    name: windows wrapper propagates exit codes
    runs-on: windows-latest
    # Read the source, and nothing else. No token write scope is needed
    # to run a test suite.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Version agrees with the python entry point
        shell: cmd
        run: |
          for /f %%v in ('python bin\ctx.py --version') do set EXPECTED=%%v
          for /f %%v in ('call bin\ctx.cmd --version') do set ACTUAL=%%v
          if not "%EXPECTED%"=="%ACTUAL%" exit /b 1
      - name: A failing command exits non-zero
        shell: cmd
        run: |
          call bin\ctx.cmd --cwd . doctor --verify
          if not errorlevel 1 (
            echo expected a non-zero exit from a ledger-less doctor run
            exit /b 1
          )
          exit /b 0

  ledger:
    name: ledger self-check
    runs-on: ubuntu-latest
    # Read the source, and nothing else. No token write scope is needed
    # to run a test suite.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Configure git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      # Scaffold a ledger in a throwaway project and assert the headless checks
      # hold. This is the path a consuming repository runs, so it is the one
      # worth proving on every push.
      - name: Scaffold and check
        run: |
          mkdir -p /tmp/fixture && cd /tmp/fixture
          git init -q .
          printf '[project]\nname = "fixture"\n' > pyproject.toml
          git add -A && git commit -qm seed
          "$GITHUB_WORKSPACE/bin/ctx" init
          "$GITHUB_WORKSPACE/bin/ctx" doctor
          "$GITHUB_WORKSPACE/bin/ctx" ci
          "$GITHUB_WORKSPACE/bin/ctx" migrate --check

      - name: Entry points agree
        run: |
          test "$(./bin/ctx --version)" = "$(python bin/ctx.py --version)"
          test "$(./bin/ctx --version)" = "$(python -m ctx --version)"

      - name: Version is in step with the manifest
        run: |
          python - <<'PY'
          import json, pathlib, re
          manifest = json.loads(pathlib.Path(".claude-plugin/plugin.json").read_text())
          source = pathlib.Path("ctx/__init__.py").read_text()
          declared = re.search(r'__version__ = "([^"]+)"', source).group(1)
          assert manifest["version"] == declared, (manifest["version"], declared)
          print("version", declared)
          PY

  # Static analysis, once. The matrix above proves the suite runs on nine
  # interpreter/OS combinations; ruff reading the same bytes nine times would
  # prove the same thing nine times, so it runs on ubuntu only.
  lint:
    name: ruff
    runs-on: ubuntu-latest
    # Read the source, and nothing else. A linter needs no write scope.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      # Pinned exactly, like every `uses:` above: a linter that upgrades
      # itself turns an unrelated push red on a rule nobody chose. Dependabot
      # does not watch this pin -- .github/dependabot.yml carries no `pip`
      # ecosystem, because there is no dependency manifest for it to read --
      # so moving it is a deliberate edit, made with the suite in front of you.
      - name: Install ruff
        run: python -m pip install --disable-pip-version-check --quiet ruff==0.16.7

      # The rule set lives in pyproject.toml, not here, so that `ruff check`
      # run locally is the same check. It is narrow and it is not empty: see
      # the comment above [tool.ruff.lint] for what was enabled, what was
      # deliberately left out, and which violations are recorded as follow-ups
      # rather than hidden behind an exclude.
      - name: Ruff
        run: ruff check --no-cache ctx/ tests/

      # And the tests about the configuration, run here because this is the
      # one job where ruff is on PATH: `RuffReallyRunsTests` executes the
      # configured rule set against a file with an undefined name in it and
      # requires a non-zero exit. Everywhere else in the matrix -- no ruff
      # installed, stdlib only -- those two tests skip, which is precisely the
      # vacuum this step fills.
      - name: The lint configuration's own tests
        run: python -m unittest tests.test_lint_and_coverage -v

  # Coverage, also once. Same reason as ruff, plus: the number would differ
  # slightly per platform and a floor would then be enforcing whichever
  # runner happened to be least generous.
  coverage:
    name: coverage floor
    runs-on: ubuntu-latest
    # Read the source, and nothing else.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      # The worktree tier runs real git, so the runner needs an identity.
      - name: Configure git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      # coverage measures; build and hatchling exist so that
      # tests/test_lint_and_coverage.py can really build an sdist and read the
      # archive in this job instead of skipping the way it does in the
      # dependency-free matrix. All three pinned exactly.
      - name: Install coverage and a real build backend
        run: |
          python -m pip install --disable-pip-version-check --quiet \
            coverage==7.13.0 build==1.3.0 hatchling==1.27.0

      # Configuration (branch coverage, `source = ["ctx"]`) is in
      # pyproject.toml so a local run measures what CI measures.
      - name: Measure
        run: |
          python -m coverage run -m unittest discover -s tests
          python -m coverage json -o coverage.json
          python -m coverage report

      # The gate is a separate step so it can be lifted out of this file and
      # executed against a synthetic report: tests/test_lint_and_coverage.py
      # feeds it a figure below the floor and asserts a non-zero exit, the way
      # tests/test_ci_floor.py establishes SUITE_FLOOR by behaviour rather
      # than by grepping YAML.
      - name: Coverage floor
        shell: python
        run: |
          import json
          import pathlib

          # THE COVERAGE FLOORS. Measured, then set just under the measurement,
          # exactly as SUITE_FLOOR is: a floor far below the real number cannot
          # see a drop. The suite measured 92.80% line and 86.83% branch over
          # `ctx/` at 1401 tests; the ~1.8 point gap is headroom for the
          # platform differences between the machine that measured and this
          # runner, not slack to spend. Raise them as coverage rises.
          # REQUIRED_LINE_FLOOR and REQUIRED_BRANCH_FLOOR in
          # tests/test_lint_and_coverage.py are the same decision and are
          # asserted equal to these two numbers; move them together.
          LINE_FLOOR = 91.0
          BRANCH_FLOOR = 85.0

          report = pathlib.Path("coverage.json")
          if not report.exists():
              print("FAIL: no coverage.json. The measure step did not run, or "
                    "it wrote nothing, so there is no number to hold to the "
                    "floors of %.1f%% line / %.1f%% branch."
                    % (LINE_FLOOR, BRANCH_FLOOR))
              raise SystemExit(1)

          try:
              totals = json.loads(report.read_text(encoding="utf-8"))["totals"]
              statements = int(totals["num_statements"])
              branches = int(totals["num_branches"])
              covered_lines = int(totals["covered_lines"])
              covered_branches = int(totals["covered_branches"])
          except (ValueError, KeyError, TypeError) as error:
              print("FAIL: coverage.json is not a coverage report (%s: %s)."
                    % (type(error).__name__, error))
              raise SystemExit(1)

          # A report over nothing would divide by zero, or -- worse -- measure
          # one module and pass at 100%. `ctx/` is thousands of statements, so
          # a tiny denominator means coverage measured the wrong tree.
          if statements < 3000 or branches < 1000:
              print("FAIL: coverage measured %d statements and %d branches. "
                    "That is not the `ctx` package; the measurement, not the "
                    "code, is what is wrong." % (statements, branches))
              raise SystemExit(1)

          line = 100.0 * covered_lines / statements
          branch = 100.0 * covered_branches / branches

          failures = []
          if line < LINE_FLOOR:
              failures.append("line coverage %.2f%% is below the floor of %.2f%%"
                              % (line, LINE_FLOOR))
          if branch < BRANCH_FLOOR:
              failures.append("branch coverage %.2f%% is below the floor of %.2f%%"
                              % (branch, BRANCH_FLOOR))
          if failures:
              print("FAIL: " + "; ".join(failures) + ". Cover the new code, or "
                    "lower the floors in .github/workflows/ci.yml and "
                    "tests/test_lint_and_coverage.py together and on purpose.")
              raise SystemExit(1)

          print("OK: line %.2f%% (floor %.2f%%), branch %.2f%% (floor %.2f%%)."
                % (line, LINE_FLOOR, branch, BRANCH_FLOOR))
